  # ── Frontend Angular SSR ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-client
      dockerfile: Dockerfile
    container_name: dynamix_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4000:4000"
    environment:
      # Le SSR Angular appelle le backend en interne via le nom du service Docker
      API_BASE_URL: http://backend:3000

volumes:
  postgres_data: