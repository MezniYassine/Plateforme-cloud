- name: Orchestration SaaS - Déploiement d'une application
  hosts: saas_servers
  gather_facts: false
  roles:
    - role: saas

  post_tasks:
    - name: "Attendre que l'application Web réponde via Nginx Ingress (Readiness HTTP)"
      ansible.builtin.uri:
        url: "http://127.0.0.1"
        headers:
          Host: "{{ saas_domain }}"
        status_code: [200, 301, 302, 401, 403]
        follow_redirects: none
      register: http_result
      until: http_result.status in [200, 301, 302, 401, 403]
      retries: 30
      delay: 2
      ignore_errors: true

    - name: Confirmer la disponibilité du service
      ansible.builtin.debug:
        msg: "✅ L'application SaaS {{ instance_name }} est prête et accessible via Nginx Ingress sur http://{{ saas_domain }} (HTTP {{ http_result.status | default('OK') }})"

