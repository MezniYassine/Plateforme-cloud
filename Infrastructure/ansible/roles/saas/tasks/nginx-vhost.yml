---
- name: Générer la configuration du VirtualHost Nginx pour le sous-domaine
  ansible.builtin.copy:
    dest: "/opt/dynamix/nginx/conf.d/{{ instance_name }}.conf"
    mode: '0644'
    content: |
      server {
          listen 80;
          server_name {{ saas_domain }};

          resolver 127.0.0.11 valid=10s ipv6=off;
          client_max_body_size 100M;

          location / {
              set $upstream {{ instance_name }}:{{ container_internal_port }};
              proxy_pass http://$upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_connect_timeout 60s;
              proxy_send_timeout 600s;
              proxy_read_timeout 600s;
          }
      }

- name: Recharger la configuration Nginx Ingress
  community.docker.docker_container_exec:
    container: dynamix-proxy
    command: nginx -s reload
