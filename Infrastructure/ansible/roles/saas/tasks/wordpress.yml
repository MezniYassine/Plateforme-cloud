---
- name: Déploiement WordPress (Mode Lié à un SGBD PaaS existant)
  when: linked_paas | default(false) | bool
  block:
    - name: Démarrer le conteneur WordPress lié
      community.docker.docker_container:
        name: "{{ instance_name }}"
        image: "wordpress:latest"
        state: started
        restart_policy: always
        published_ports:
          - "{{ external_port }}:80"
        env:
          WORDPRESS_DB_HOST: "{{ wp_db_host }}"
          WORDPRESS_DB_USER: "{{ wp_db_user }}"
          WORDPRESS_DB_PASSWORD: "{{ wp_db_password }}"
          WORDPRESS_DB_NAME: "{{ wp_db_name }}"
        volumes:
          - "/var/lib/saas/data/{{ instance_name }}:/var/www/html"

- name: Déploiement WordPress (Mode Standalone avec Base MySQL dédiée)
  when: not (linked_paas | default(false) | bool)
  block:
    - name: Créer le réseau Docker isolé pour WordPress
      community.docker.docker_network:
        name: "net_{{ instance_name }}"
        state: present

    - name: Créer le répertoire persistant pour la base de données WordPress
      ansible.builtin.file:
        path: "/var/lib/saas/data/{{ instance_name }}_db"
        state: directory
        mode: '0777'

    - name: Démarrer la base MySQL dédiée à WordPress
      community.docker.docker_container:
        name: "{{ instance_name }}_db"
        image: "mysql:8.0"
        state: started
        restart_policy: always
        networks:
          - name: "net_{{ instance_name }}"
        env:
          MYSQL_ROOT_PASSWORD: "{{ wp_db_password }}"
          MYSQL_DATABASE: "wordpress"
          MYSQL_USER: "wp_user"
          MYSQL_PASSWORD: "{{ wp_db_password }}"
        volumes:
          - "/var/lib/saas/data/{{ instance_name }}_db:/var/lib/mysql"

    - name: Démarrer le conteneur WordPress connecté à sa base dédiée
      community.docker.docker_container:
        name: "{{ instance_name }}"
        image: "wordpress:latest"
        state: started
        restart_policy: always
        networks:
          - name: "net_{{ instance_name }}"
        published_ports:
          - "{{ external_port }}:80"
        env:
          WORDPRESS_DB_HOST: "{{ instance_name }}_db:3306"
          WORDPRESS_DB_USER: "wp_user"
          WORDPRESS_DB_PASSWORD: "{{ wp_db_password }}"
          WORDPRESS_DB_NAME: "wordpress"
        volumes:
          - "/var/lib/saas/data/{{ instance_name }}:/var/www/html"
