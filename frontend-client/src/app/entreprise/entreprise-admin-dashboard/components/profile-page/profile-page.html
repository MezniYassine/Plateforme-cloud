<div style="max-width:600px">
    <form [formGroup]="profileForm" (ngSubmit)="onUpdate()">
        <div class="section-card" style="margin-bottom:16px">
            <div class="card-header">
                <div class="card-title">Informations de l'entreprise</div>
                <button class="btn-sm primary" type="submit" [disabled]="profileForm.invalid">Enregistrer</button>
            </div>
            <div style="padding:20px 22px;display:flex;flex-direction:column;gap:14px">
                <div
                    style="display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--border-light)">
                    <div class="admin-avatar" style="width:52px;height:52px;font-size:18px;border-radius:13px">
                        {{ getInitials(adminName()) }}
                    </div>
                    <div>
                        <div style="font-size:14px;font-weight:600">{{ adminName() }}</div>
                        <div style="font-size:12.5px;color:var(--text-muted)">Admin Entreprise · {{ companyName() }}
                        </div>
                        <span class="badge approved" style="margin-top:4px">
                            <div class="badge-dot"></div>Compte approuvé
                        </span>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div class="profile-field">
                        <label>Prénom</label>
                        <input type="text" formControlName="adminPrenom">
                    </div>
                    <div class="profile-field">
                        <label>Nom</label>
                        <input type="text" formControlName="adminNom">
                    </div>
                </div>

                <div class="profile-field">
                    <label>Email administrateur</label>
                    <input type="email" formControlName="adminEmail">
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div class="profile-field">
                        <label>Raison sociale</label>
                        <input type="text" formControlName="companyName">
                    </div>
                    <div class="profile-field">
                        <label>Identifiant fiscal</label>
                        <input type="text" formControlName="taxId">
                    </div>
                </div>
            </div>
        </div>
    </form>

    <div class="section-card">
        <div class="card-header">
            <div class="card-title">Sécurité du compte</div>
        </div>
        <div style="padding:14px 22px;display:flex;flex-direction:column;gap:10px">
            <div
                style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm)">
                <div>
                    <div style="font-size:13.5px;font-weight:600">Authentification MFA</div>
                    <div style="font-size:12px;color:var(--text-muted)">Protégez votre compte avec un code TOTP</div>
                </div>
                <button class="btn-sm primary" type="button">Activer</button>
            </div>

            <div
                style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm)">
                <div>
                    <div style="font-size:13.5px;font-weight:600">Changer le mot de passe</div>
                    <div style="font-size:12px;color:var(--text-muted)">Mettre à jour votre accès sécurisé</div>
                </div>
                <button class="btn-sm" type="button" (click)="showPasswordModal = true">Modifier</button>
            </div>

            @if (showPasswordModal) {
            <app-change-password-modal (closeDialog)="showPasswordModal = false"></app-change-password-modal>
            }
        </div>
    </div>
</div>
